# Deploy Stack — Sistema de Incidencias Georreferenciadas
# Uso: docker stack deploy -c deploy.yml incidencias-stack
#
# Requisitos:
#   - Docker Swarm mode activado
#   - Archivo .env con variables de entorno (DB_PASSWORD, JWT_SECRET, etc.)
#   - PostGIS 17+, Redis 8+
services:
  frontend:
    image: ghcr.io/sistema-incidencias/frontend:latest
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      - backend
    networks:
      - incidencias-network
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/nginx_status"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      replicas: 2
      update_config:
        parallelism: 1
        delay: 10s
        order: start-first
        failure_action: rollback
      restart_policy:
        condition: any

  backend:
    image: ghcr.io/sistema-incidencias/backend:latest
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      APP_NAME: ${APP_NAME:-Sistema de Incidencias Georreferenciadas}
      APP_ENV: ${APP_ENV:-production}
      APP_DEBUG: ${APP_DEBUG:-false}
      APP_KEY: ${APP_KEY:-base64:u6tjIC/VFXSw3JCFREITtaD1jjhDj7ekTQN4WQXcft8=}
      APP_URL: ${APP_URL:-http://localhost}
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: "5432"
      DB_DATABASE: ${DB_DATABASE:-incidencias_db}
      DB_USERNAME: ${DB_USERNAME:-user}
      DB_PASSWORD: ${DB_PASSWORD:-password}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      SESSION_DRIVER: ${SESSION_DRIVER:-file}
      CACHE_STORE: ${CACHE_STORE:-file}
      QUEUE_CONNECTION: ${QUEUE_CONNECTION:-sync}
      # Folded scalar (- preserva contenido al partir el string en lineas).
      # yamllint disable-line rule:line-length
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-jwt_access_secret_for_development_only_change_in_prod}
      JWT_ACCESS_EXPIRES_IN: ${JWT_ACCESS_EXPIRES_IN:-15m}
      # yamllint disable-line rule:line-length
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-jwt_refresh_secret_for_development_only_change_in_prod}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-7d}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost}
      API_VERSION: ${API_VERSION:-1.0.0}
      # Storage: AWS_* is read by Laravel directly (S3 driver, filesystems
      # cache, queue, StorageService). One source of truth, no rename.
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-rustfsadmin}
      # yamllint disable-line rule:line-length
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-rustfsadmin}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-us-east-1}
      AWS_BUCKET: ${AWS_BUCKET:-incidencias}
      AWS_ENDPOINT: ${AWS_ENDPOINT:-http://rustfs:9000}
      AWS_USE_PATH_STYLE_ENDPOINT: ${AWS_USE_PATH_STYLE_ENDPOINT:-true}
      FILESYSTEM_STORAGE_DISK: ${FILESYSTEM_STORAGE_DISK:-s3}
      OCTANE_SERVER: frankenphp
      LOG_CHANNEL: stderr_json
      MERCURE_PUBLIC_URL: >-
        ${MERCURE_PUBLIC_URL:-http://mercure/.well-known/mercure}
      # yamllint disable-line rule:line-length
      MERCURE_PUBLISHER_JWT_SECRET: ${MERCURE_PUBLISHER_JWT_SECRET:-}
      # yamllint disable-line rule:line-length
      MERCURE_SUBSCRIBER_JWT_SECRET: ${MERCURE_SUBSCRIBER_JWT_SECRET:-}
      FIREBASE_CREDENTIALS: ${FIREBASE_CREDENTIALS:-}
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-}
      FIREBASE_LEEWAY_SECONDS: ${FIREBASE_LEEWAY_SECONDS:-}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      - db
      - redis
    networks:
      - incidencias-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      replicas: 2
      update_config:
        parallelism: 1
        delay: 10s
        order: start-first
        failure_action: rollback
      restart_policy:
        condition: any

  db:
    image: postgis/postgis:17-3.5-alpine
    environment:
      POSTGRES_DB: ${DB_DATABASE:-incidencias_db}
      POSTGRES_USER: ${DB_USERNAME:-user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-password}
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - incidencias-network
    deploy:
      replicas: 1
      restart_policy:
        condition: any
    healthcheck:
      test:
        - "CMD-SHELL"
        - "pg_isready -U ${DB_USERNAME:-user}"
        - "-d ${DB_DATABASE:-incidencias_db}"
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8-alpine
    # CRITICAL: --requirepass protects Redis. The same secret is used
    # by the backend via REDIS_PASSWORD. Without this any process with
    # network access to the redis container can read every key in
    # the cache (which includes the Mercure subscriber JWTs).
    command:
      - redis-server
      - "--requirepass"
      - "${REDIS_PASSWORD:-}"
      - "--appendonly"
      - "yes"
    volumes:
      - redis_data:/data
    # NOTE: deliberately no `ports:` in prod. Redis is reachable only
    # from inside the incidencias-network. If you need to debug from
    # the host, use `docker exec -it <redis-container> redis-cli -a $PWD`
    # rather than exposing the port.
    networks:
      - incidencias-network
    deploy:
      replicas: 1
      restart_policy:
        condition: any
    healthcheck:
      test:
        - CMD
        - redis-cli
        - -a
        - "${REDIS_PASSWORD}"
        - --no-auth-warning
        - ping
      interval: 10s
      timeout: 3s
      retries: 5

  # ==========================================
  # MERCURE HUB (real-time push for notifications)
  # ==========================================
  # Reuses the same publisher/subscriber JWT secrets as the backend so
  # the credentials never fall out of sync. We pin the JWT alg to HS256
  # explicitly because the default differs across dunglas/mercure
  # image versions and the backend signs with HS256 too.
  #
  # 🔴 In prod, ALLOW_ANONYMOUS must be "0" so subscriptions require a
  # signed mercureAuthorization cookie. The "1" value is for dev only.
  # No `ports:` exposed to host; the backend (and the frontend nginx
  # via the backend's /.well-known/mercure location) reach it over
  # incidencias-network.
  mercure:
    image: dunglas/mercure:latest
    environment:
      SERVER_NAME: ":80"
      MERCURE_PUBLISHER_JWT_KEY: ${MERCURE_PUBLISHER_JWT_SECRET:-}
      MERCURE_SUBSCRIBER_JWT_KEY: ${MERCURE_SUBSCRIBER_JWT_SECRET:-}
      MERCURE_PUBLISHER_JWT_ALG: HS256
      MERCURE_SUBSCRIBER_JWT_ALG: HS256
      ALLOW_ANONYMOUS: "0"
      CORS_ALLOWED_ORIGINS: "*"
    networks:
      - incidencias-network
    deploy:
      replicas: 1
      restart_policy:
        condition: any
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider 'http://127.0.0.1/.well-known/mercure?topic=health' || exit 0"]
      interval: 10s
      timeout: 5s
      retries: 3

  rustfs:
    image: ${RUSTFS_IMAGE:-rustfs/rustfs:latest}
    user: root
    entrypoint: >
      /bin/sh -c "chown -R 10001:10001 /data && exec /entrypoint.sh rustfs"
    environment:
      # yamllint disable-line rule:line-length
      RUSTFS_ACCESS_KEY: ${STORAGE_ACCESS_KEY:-rustfsadmin}
      # yamllint disable-line rule:line-length
      RUSTFS_SECRET_KEY: ${STORAGE_SECRET_KEY:-rustfsadmin}
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ENABLE: "true"
    volumes:
      - rustfs_data:/data
    ports:
      - "${RUSTFS_API_PORT:-9000}:9000"
      - "${RUSTFS_CONSOLE_PORT:-9001}:9001"
    healthcheck:
      test:
        - "CMD-SHELL"
        - 'curl -s -o /dev/null -w "%{http_code}" http://localhost:9000/'
        - "| grep -qE '200|403'"
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - incidencias-network
    deploy:
      replicas: 1
      restart_policy:
        condition: any

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./ops/prometheus/prometheus.swarm.yml:/etc/prometheus/prometheus.yml
    networks:
      - incidencias-network
    deploy:
      replicas: 1
      restart_policy:
        condition: any

  grafana:
    image: grafana/grafana:latest
    ports:
      - "${GRAFANA_PORT:-3001}:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Admin"
    volumes:
      - ./ops/grafana/provisioning:/etc/grafana/provisioning
      - ./ops/dashboards:/var/lib/grafana/dashboards
      - ./ops/dashboards-k6:/var/lib/grafana/dashboards-k6
      - grafana_data:/var/lib/grafana
    networks:
      - incidencias-network
    deploy:
      replicas: 1
      restart_policy:
        condition: any

  loki:
    image: grafana/loki:latest
    ports:
      - "${LOKI_PORT:-3100}:3100"
    volumes:
      - ./ops/loki/loki.yml:/etc/loki/loki.yml
    networks:
      - incidencias-network
    deploy:
      replicas: 1
      restart_policy:
        condition: any

  promtail:
    image: grafana/promtail:latest
    user: root
    volumes:
      - ./ops/promtail/promtail.yml:/etc/promtail/config.yml
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - incidencias-network
    deploy:
      mode: global
      restart_policy:
        condition: any

  postgres_exporter:
    image: prometheuscommunity/postgres-exporter:latest
    environment:
      # Conexion en vars separadas (postgres_exporter acepta
      # DATA_SOURCE_HOST/PORT/USER/PASS/DB/SSLMODE individualmente).
      # DATA_SOURCE_NAME completo (161 chars) supera el limite de 80.
      DATA_SOURCE_HOST: db
      DATA_SOURCE_PORT: "5432"
      DATA_SOURCE_USER: ${DB_USERNAME:-user}
      # yamllint disable-line rule:line-length
      DATA_SOURCE_PASS: ${DB_PASSWORD:-password}
      DATA_SOURCE_DB: ${DB_DATABASE:-incidencias_db}
      DATA_SOURCE_SSLMODE: disable
    networks:
      - incidencias-network
    deploy:
      replicas: 1
      restart_policy:
        condition: any

  redis_exporter:
    image: oliver006/redis_exporter:latest
    environment:
      REDIS_ADDR: "redis:6379"
    networks:
      - incidencias-network
    deploy:
      replicas: 1
      restart_policy:
        condition: any

  portainer:
    image: portainer/portainer-ce:lts
    command: -H unix:///var/run/docker.sock
    ports:
      - "${PORTAINER_HTTPS_PORT:-9443}:9443"
      - "${PORTAINER_HTTP_PORT:-9010}:9000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data
    networks:
      - incidencias-network
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: any

  cloudflared:
    image: cloudflare/cloudflared:latest
    command:
      - tunnel
      - --no-autoupdate
      - run
      - --token
      # yamllint disable-line rule:line-length
      - ${CLOUDFLARE_TUNNEL_TOKEN:-}
    restart: unless-stopped
    depends_on:
      - frontend
      - backend
      - sonarqube
    networks:
      - incidencias-network
    deploy:
      replicas: 1
      restart_policy:
        condition: any

  # ==========================================
  # STATIC CODE ANALYSIS (SonarQube)
  # ==========================================
  # SonarQube ships its own UI/dashboard, intentionally kept separate from
  # the Prometheus/Grafana/Loki observability stack.
  #
  # NOTE: Elasticsearch (embedded) requires vm.max_map_count >= 262144 on
  # the host. Persist it with:
  #   echo "vm.max_map_count=262144" | sudo tee -a /etc/sysctl.conf \
  #     && sudo sysctl -p
  sonarqube_db:
    image: ${SONARQUBE_DB_IMAGE:-postgres:17-alpine}
    # Override del puerto interno. La imagen postgres:*-alpine no expone
    # POSTGRES_PORT como env var; pasamos -p <puerto> al binario.
    # Si se cambia SONARQUBE_DB_PORT en .env, este command lo respeta.
    command: ["postgres", "-p", "${SONARQUBE_DB_PORT:-5432}"]
    environment:
      POSTGRES_DB: ${SONARQUBE_DB_DATABASE:-sonarqube}
      POSTGRES_USER: ${SONARQUBE_DB_USERNAME:-sonarqube}
      # yamllint disable-line rule:line-length
      POSTGRES_PASSWORD: ${SONARQUBE_DB_PASSWORD:-sonarqube}
    volumes:
      - sonarqube_db_data:/var/lib/postgresql/data
    networks:
      - incidencias-network
    deploy:
      replicas: 1
      restart_policy:
        condition: any
    healthcheck:
      test:
        - "CMD-SHELL"
        - "pg_isready -U ${SONARQUBE_DB_USERNAME:-sonarqube}"
        - "-d ${SONARQUBE_DB_DATABASE:-sonarqube}"
        - "-p ${SONARQUBE_DB_PORT:-5432}"
      interval: 10s
      timeout: 5s
      retries: 5

  sonarqube:
    image: ${SONARQUBE_IMAGE:-sonarqube:26.7.0.124771-community}
    depends_on:
      - sonarqube_db
    environment:
      # sonarqube_db:${SONARQUBE_DB_PORT:-5432} usa el puerto INTERNO
      # del contenedor sonarqube_db, parametrizable via .env.
      # yamllint disable-line rule:line-length
      SONAR_JDBC_URL: "jdbc:postgresql://sonarqube_db:${SONARQUBE_DB_PORT:-5432}/${SONARQUBE_DB_DATABASE:-sonarqube}"
      SONAR_JDBC_USERNAME: ${SONARQUBE_DB_USERNAME:-sonarqube}
      # yamllint disable-line rule:line-length
      SONAR_JDBC_PASSWORD: ${SONARQUBE_DB_PASSWORD:-sonarqube}
    ports:
      - "${SONARQUBE_PORT:-9002}:9000"
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
    networks:
      - incidencias-network
    deploy:
      replicas: 1
      restart_policy:
        condition: any
    healthcheck:
      test:
        - "CMD-SHELL"
        - "curl -s http://localhost:9000/api/system/status"
        - '| grep -q ''"status":"UP"'''
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 60s

volumes:
  db_data:
  redis_data:
  rustfs_data:
  grafana_data:
  portainer_data:
  sonarqube_data:
  sonarqube_extensions:
  sonarqube_db_data:

networks:
  incidencias-network:
    driver: overlay

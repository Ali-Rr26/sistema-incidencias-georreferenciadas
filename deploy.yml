version: "3.9"

services:
  app:
    image: laravel-app:latest

    volumes:
      - ./proyecto:/var/www

    networks:
      - app-network

    deploy:
      replicas: 3

      restart_policy:
        condition: any

  web:
    image: nginx:alpine

    ports:
      - "80:80"

    volumes:
      - ./proyecto:/var/www
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro

    networks:
      - app-network

    deploy:
      replicas: 2

      restart_policy:
        condition: any

  db:
    image: mysql:8.0

    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: incidencias_db
      MYSQL_USER: user
      MYSQL_PASSWORD: password

    volumes:
      - db_data:/var/lib/mysql

    networks:
      - app-network

volumes:
  db_data:

networks:
  app-network:
    driver: overlay

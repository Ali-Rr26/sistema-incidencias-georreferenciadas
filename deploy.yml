# Deploy Stack — Sistema de Incidencias Georreferenciadas
# Uso: docker stack deploy -c deploy.yml incidencias-stack
#
# Requisitos:
#   - Docker Swarm mode activado
#   - Archivo .env con variables de entorno (DB_PASSWORD, JWT_SECRET, etc.)
#   - PostGIS 17+, Redis 8+
services:
  frontend:
    image: ghcr.io/sistema-incidencias/frontend:latest
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      - backend
    networks:
      - incidencias-network
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/nginx_status"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      replicas: 2
      update_config:
        parallelism: 1
        delay: 10s
        order: start-first
        failure_action: rollback
      restart_policy:
        condition: any

  backend:
    image: ghcr.io/sistema-incidencias/backend:latest
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      OCTANE_SERVER: frankenphp
      LOG_CHANNEL: stderr_json
      MERCURE_PUBLISHER_JWT_SECRET: ${MERCURE_PUBLISHER_JWT_SECRET:-}
      MERCURE_SUBSCRIBER_JWT_SECRET: ${MERCURE_SUBSCRIBER_JWT_SECRET:-}
      FIREBASE_CREDENTIALS: ${FIREBASE_CREDENTIALS:-}
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-}
      FIREBASE_LEEWAY_SECONDS: ${FIREBASE_LEEWAY_SECONDS:-}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      - db
      - redis
    networks:
      - incidencias-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      replicas: 2
      update_config:
        parallelism: 1
        delay: 10s
        order: start-first
        failure_action: rollback
      restart_policy:
        condition: any

  db:
    image: postgis/postgis:17-3.5-alpine
    environment:
      POSTGRES_DB: ${DB_DATABASE:-incidencias_db}
      POSTGRES_USER: ${DB_USERNAME:-user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Variable DB_PASSWORD requerida}
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - incidencias-network
    deploy:
      replicas: 1
      restart_policy:
        condition: any
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-user} -d ${DB_DATABASE:-incidencias_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8-alpine
    volumes:
      - redis_data:/data
    networks:
      - incidencias-network
    deploy:
      replicas: 1
      restart_policy:
        condition: any
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  rustfs:
    image: ${RUSTFS_IMAGE:-rustfs/rustfs:latest}
    user: root
    entrypoint: >
      /bin/sh -c "chown -R 10001:10001 /data && exec /entrypoint.sh rustfs"
    environment:
      RUSTFS_ACCESS_KEY: ${STORAGE_ACCESS_KEY:?Variable STORAGE_ACCESS_KEY requerida}
      RUSTFS_SECRET_KEY: ${STORAGE_SECRET_KEY:?Variable STORAGE_SECRET_KEY requerida}
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ENABLE: "true"
    volumes:
      - rustfs_data:/data
    ports:
      - "${RUSTFS_API_PORT:-9000}:9000"
      - "${RUSTFS_CONSOLE_PORT:-9001}:9001"
    healthcheck:
      test: ["CMD-SHELL", "curl -s -o /dev/null -w \"%{http_code}\" http://localhost:9000/ | grep -qE '200|403'"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - incidencias-network
    deploy:
      replicas: 1
      restart_policy:
        condition: any

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./ops/prometheus/prometheus.swarm.yml:/etc/prometheus/prometheus.yml
    networks:
      - incidencias-network
    deploy:
      replicas: 1
      restart_policy:
        condition: any

  grafana:
    image: grafana/grafana:latest
    ports:
      - "${GRAFANA_PORT:-3001}:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Admin"
    volumes:
      - ./ops/grafana/provisioning:/etc/grafana/provisioning
      - ./ops/dashboards:/var/lib/grafana/dashboards
      - ./ops/dashboards-k6:/var/lib/grafana/dashboards-k6
      - grafana_data:/var/lib/grafana
    networks:
      - incidencias-network
    deploy:
      replicas: 1
      restart_policy:
        condition: any

  loki:
    image: grafana/loki:latest
    ports:
      - "${LOKI_PORT:-3100}:3100"
    volumes:
      - ./ops/loki/loki.yml:/etc/loki/loki.yml
    networks:
      - incidencias-network
    deploy:
      replicas: 1
      restart_policy:
        condition: any

  promtail:
    image: grafana/promtail:latest
    user: root
    volumes:
      - ./ops/promtail/promtail.yml:/etc/promtail/config.yml
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - incidencias-network
    deploy:
      mode: global
      restart_policy:
        condition: any

  postgres_exporter:
    image: prometheuscommunity/postgres-exporter:latest
    environment:
      DATA_SOURCE_NAME: "postgresql://${DB_USERNAME:-user}:${DB_PASSWORD:?Variable DB_PASSWORD requerida}@db:5432/${DB_DATABASE:-incidencias_db}?sslmode=disable"
    networks:
      - incidencias-network
    deploy:
      replicas: 1
      restart_policy:
        condition: any

  redis_exporter:
    image: oliver006/redis_exporter:latest
    environment:
      REDIS_ADDR: "redis:6379"
    networks:
      - incidencias-network
    deploy:
      replicas: 1
      restart_policy:
        condition: any

  portainer:
    image: portainer/portainer-ce:lts
    command: -H unix:///var/run/docker.sock
    ports:
      - "${PORTAINER_HTTPS_PORT:-9443}:9443"
      - "${PORTAINER_HTTP_PORT:-9010}:9000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data
    networks:
      - incidencias-network
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: any

  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN:?Variable CLOUDFLARE_TUNNEL_TOKEN requerida}
    restart: unless-stopped
    depends_on:
      - frontend
      - backend
    networks:
      - incidencias-network
    deploy:
      replicas: 1
      restart_policy:
        condition: any

volumes:
  db_data:
  redis_data:
  rustfs_data:
  grafana_data:
  portainer_data:

networks:
  incidencias-network:
    driver: overlay

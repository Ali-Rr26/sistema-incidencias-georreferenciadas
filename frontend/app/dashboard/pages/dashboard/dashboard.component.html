<div class="page-breadcrumb">
  <div class="row">
    <div class="col-12 align-self-center">
      <h3 class="page-title text-truncate text-dark font-weight-medium mb-1">
        Dashboard
      </h3>
      <div class="d-flex align-items-center">
        <nav aria-label="breadcrumb">
          <ol class="breadcrumb m-0 p-0">
            <li class="breadcrumb-item"><a href="#/dashboard">Dashboard</a></li>
          </ol>
        </nav>
      </div>
    </div>
  </div>
</div>

<div class="container-fluid">
  <!-- ================================================
       Stats cards — card-group (patrón FreeDash)
       ================================================ -->
  <div class="card-group">
    <div class="card border-end">
      <div class="card-body">
        <div class="d-flex d-lg-flex d-md-block align-items-center">
          <div>
            <div class="d-inline-flex align-items-center">
              <h2
                class="text-dark mb-1 font-weight-medium"
                id="stat-incidencias"
              >
                0
              </h2>
            </div>
            <h6 class="text-muted font-weight-normal mb-0 w-100 text-truncate">
              Total Incidencias
            </h6>
          </div>
          <div class="ms-auto mt-md-3 mt-lg-0">
            <span class="opacity-7 text-muted"
              ><i class="fas fa-map-marker-alt"></i
            ></span>
          </div>
        </div>
      </div>
    </div>

    <div class="card border-end">
      <div class="card-body">
        <div class="d-flex d-lg-flex d-md-block align-items-center">
          <div>
            <div class="d-inline-flex align-items-center">
              <h2
                class="text-dark mb-1 font-weight-medium"
                id="stat-pendientes"
              >
                0
              </h2>
              <span
                class="badge bg-warning font-12 text-white font-weight-medium rounded-pill ms-2 d-lg-block d-md-none"
                id="badge-pendientes"
              ></span>
            </div>
            <h6 class="text-muted font-weight-normal mb-0 w-100 text-truncate">
              Pendientes
            </h6>
          </div>
          <div class="ms-auto mt-md-3 mt-lg-0">
            <span class="opacity-7 text-muted"
              ><i class="fas fa-clock"></i
            ></span>
          </div>
        </div>
      </div>
    </div>

    <div class="card border-end">
      <div class="card-body">
        <div class="d-flex d-lg-flex d-md-block align-items-center">
          <div>
            <div class="d-inline-flex align-items-center">
              <h2 class="text-dark mb-1 font-weight-medium" id="stat-resueltas">
                0
              </h2>
              <span
                class="badge bg-success font-12 text-white font-weight-medium rounded-pill ms-2 d-lg-block d-md-none"
                id="badge-resueltas"
              ></span>
            </div>
            <h6 class="text-muted font-weight-normal mb-0 w-100 text-truncate">
              Resueltas
            </h6>
          </div>
          <div class="ms-auto mt-md-3 mt-lg-0">
            <span class="opacity-7 text-muted"
              ><i class="fas fa-check-circle"></i
            ></span>
          </div>
        </div>
      </div>
    </div>

    <div class="card">
      <div class="card-body">
        <div class="d-flex d-lg-flex d-md-block align-items-center">
          <div>
            <h2 class="text-dark mb-1 font-weight-medium" id="stat-ubicaciones">
              0
            </h2>
            <h6 class="text-muted font-weight-normal mb-0 w-100 text-truncate">
              Ubicaciones
            </h6>
          </div>
          <div class="ms-auto mt-md-3 mt-lg-0">
            <span class="opacity-7 text-muted"
              ><i class="fas fa-globe"></i
            ></span>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- ================================================
       Charts + Activity
       ================================================ -->
  <div class="row">
    <!-- C3 Donut — incidencias por estado -->
    <div class="col-lg-4 col-md-12">
      <div class="card">
        <div class="card-body">
          <h4 class="card-title">Por Estado</h4>
          <div
            id="chart-estados"
            class="mt-2"
            style="height: 220px; width: 100%"
          ></div>
          <ul class="list-style-none mb-0 mt-3">
            <li>
              <i class="fas fa-circle font-10 me-2" style="color: #ffaf01"></i>
              <span class="text-muted">Pendientes</span>
              <span
                class="text-dark float-end font-weight-medium"
                id="legend-pendientes"
                >—</span
              >
            </li>
            <li class="mt-2">
              <i class="fas fa-circle font-10 me-2" style="color: #5f76e8"></i>
              <span class="text-muted">En proceso</span>
              <span
                class="text-dark float-end font-weight-medium"
                id="legend-en-proceso"
                >—</span
              >
            </li>
            <li class="mt-2">
              <i class="fas fa-circle font-10 me-2" style="color: #22ca80"></i>
              <span class="text-muted">Resueltas</span>
              <span
                class="text-dark float-end font-weight-medium"
                id="legend-resueltas"
                >—</span
              >
            </li>
          </ul>
        </div>
      </div>
    </div>

    <!-- Actividad reciente -->
    <div class="col-lg-8 col-md-12">
      <div class="card">
        <div class="card-body">
          <h4 class="card-title">Actividad Reciente</h4>
          <div class="mt-4 activity" id="activity-feed">
            <!-- Estado vacío — se reemplaza dinámicamente -->
            <div class="text-center text-muted py-4" id="activity-empty">
              <i
                class="fas fa-inbox mb-3 d-block mx-auto"
                style="font-size: 2rem"
              ></i>
              <p class="mb-0 font-12">Sin actividad reciente</p>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

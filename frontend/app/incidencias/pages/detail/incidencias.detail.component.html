<div class="gr-page">
  <!-- Header -->
  <div class="gr-page__header">
    <div>
      <h1 class="gr-page__title" id="detalle-titulo">Cargando...</h1>
      <nav class="gr-breadcrumb">
        <span class="gr-breadcrumb__item">Gestión</span>
        <span class="gr-breadcrumb__sep">/</span>
        <a
          href="#/incidencias"
          class="gr-breadcrumb__item"
          style="text-decoration: none; color: inherit"
          >Incidencias</a
        >
        <span class="gr-breadcrumb__sep">/</span>
        <span
          class="gr-breadcrumb__item gr-breadcrumb__item--active"
          id="detalle-breadcrumb"
          >Detalle</span
        >
      </nav>
    </div>
  </div>

  <!-- Loading -->
  <div id="detalle-loading" class="text-center py-5">
    <div class="spinner-border text-primary" role="status"></div>
    <p class="mt-2 text-muted">Cargando incidencia...</p>
  </div>

  <!-- Content -->
  <div id="detalle-content" class="d-none">
    <div class="row g-4">
      <!-- Main info -->
      <div class="col-lg-8">
        <div class="gr-card">
          <div style="padding: 24px 28px">
            <div id="detalle-thumbnail" class="d-none mb-3"></div>

            <div class="d-flex justify-content-between align-items-start mb-3">
              <div>
                <span
                  class="ig-status-badge ig-status-"
                  id="detalle-status"
                ></span>
                <span
                  class="badge bg-secondary ms-2"
                  id="detalle-priority"
                ></span>
              </div>
              <small class="text-muted" id="detalle-fecha"></small>
            </div>

            <p class="text-muted" id="detalle-descripcion"></p>

            <hr />

            <div class="row g-3">
              <div class="col-md-6">
                <small class="text-muted d-block">Categoría</small>
                <span id="detalle-categoria"></span>
              </div>
              <div class="col-md-6">
                <small class="text-muted d-block">Ubicación</small>
                <span id="detalle-ubicacion"></span>
              </div>
              <div class="col-md-6">
                <small class="text-muted d-block">Reportado por</small>
                <span id="detalle-usuario"></span>
              </div>
              <div class="col-md-6">
                <small class="text-muted d-block">Organización</small>
                <span id="detalle-organizacion"></span>
              </div>
            </div>

            <div
              class="mt-3"
              id="detalle-coords"
              style="
                height: 250px;
                border-radius: 8px;
                border: 1px solid #dee2e6;
              "
            ></div>
          </div>
        </div>
      </div>

      <!-- Actions sidebar -->
      <div class="col-lg-4">
        <!-- Action buttons -->
        <div id="detalle-acciones" class="d-none mb-3">
          <div class="gr-card">
            <div style="padding: 24px 28px">
              <h5 class="fw-bold mb-3">
                <i class="fas fa-tasks me-2"></i>Acciones
              </h5>
              <div id="detalle-claim-actions" class="d-none">
                <button id="btn-reclamar" class="btn btn-primary w-100 mb-2">
                  <i class="fas fa-hand-paper me-1"></i>Reclamar
                </button>
                <button id="btn-liberar" class="btn btn-warning w-100 mb-2">
                  <i class="fas fa-undo me-1"></i>Liberar
                </button>
              </div>
              <div id="detalle-confirm-actions" class="d-none">
                <button id="btn-confirmar" class="btn btn-success w-100 mb-2">
                  <i class="fas fa-check-circle me-1"></i>Confirmar y asignar
                </button>
              </div>
              <div id="detalle-acciones-loading" class="d-none">
                <div
                  class="spinner-border spinner-border-sm text-primary me-2"
                  role="status"
                ></div>
                <span class="text-muted small">Procesando...</span>
              </div>
              <div id="detalle-acciones-error" class="d-none">
                <div
                  class="alert alert-danger py-2 mb-0 small"
                  id="detalle-acciones-msg"
                ></div>
              </div>
            </div>
          </div>
        </div>

        <!-- Estado (CP-02-01-F / CP-02-02-F / CP-02-04-F / CP-02-05-F) -->
        <div class="gr-card mb-3">
          <div style="padding: 24px 28px">
            <h5 class="fw-bold mb-3">
              <i class="fas fa-exchange-alt me-2"></i>Cambiar Estado
            </h5>
            <div class="mb-2">
              <select
                id="detalle-estado-select"
                class="form-select form-select-sm"
              ></select>
            </div>
            <button
              id="btn-guardar-estado"
              class="btn btn-primary btn-sm w-100 mb-2"
            >
              <span id="btn-estado-texto">Guardar Estado</span>
              <span id="btn-estado-loading" class="d-none">
                <span
                  class="spinner-border spinner-border-sm me-1"
                  role="status"
                ></span
                >Guardando...
              </span>
            </button>
            <div id="detalle-estado-error" class="d-none">
              <div
                class="alert alert-danger py-2 mb-2 small"
                id="detalle-estado-msg"
              ></div>
            </div>
            <div
              id="detalle-resolucion"
              class="d-none mt-2 p-2 bg-light rounded"
            >
              <small class="text-muted d-block">
                <i class="fas fa-calendar-check me-1"></i>Fecha resolución
              </small>
              <span
                id="detalle-fecha-resolucion"
                class="small fw-semibold text-success"
              ></span>
            </div>
          </div>
        </div>

        <!-- Historial (CP-02-03-F) -->
        <div class="gr-card mb-3">
          <div style="padding: 24px 28px">
            <h5 class="fw-bold mb-3">
              <i class="fas fa-history me-2"></i>Historial de estados
            </h5>
            <div id="detalle-historial-loading" class="text-center py-2">
              <div
                class="spinner-border spinner-border-sm text-secondary"
                role="status"
              ></div>
            </div>
            <div id="detalle-historial-list"></div>
            <p
              id="detalle-historial-vacio"
              class="text-muted small mb-0 d-none"
            >
              Sin cambios de estado registrados.
            </p>
          </div>
        </div>

        <!-- Images -->
        <div class="gr-card">
          <div style="padding: 24px 28px">
            <h5 class="fw-bold mb-3">
              <i class="fas fa-images me-2"></i>Imágenes
            </h5>

            <!-- Upload form -->
            <div id="detalle-upload-form" class="mb-3">
              <input
                type="file"
                id="detalle-file-input"
                accept="image/jpeg,image/png,image/webp"
                class="form-control form-control-sm mb-2"
              />
              <button
                id="btn-subir-imagen"
                class="gr-btn-primary btn-sm w-100"
                disabled
              >
                <i class="fas fa-upload me-1"></i>Subir imagen
              </button>
              <div id="detalle-upload-progress" class="d-none mt-2">
                <div class="progress" style="height: 6px">
                  <div
                    class="progress-bar progress-bar-striped progress-bar-animated"
                    style="width: 100%"
                  ></div>
                </div>
                <small class="text-muted">Subiendo...</small>
              </div>
            </div>

            <!-- Image gallery -->
            <div id="detalle-imagenes">
              <p class="text-muted small mb-0" id="detalle-sin-imagenes">
                Sin imágenes
              </p>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Toast -->
<div class="position-fixed bottom-0 end-0 p-3" style="z-index: 9999">
  <div
    id="toast-imagen"
    class="toast align-items-center text-white bg-success border-0"
    role="alert"
    aria-live="assertive"
    aria-atomic="true"
  >
    <div class="d-flex">
      <div class="toast-body">
        <i class="fas fa-check-circle me-2"></i>Imagen subida correctamente.
      </div>
      <button
        type="button"
        class="btn-close btn-close-white me-2 m-auto"
        data-bs-dismiss="toast"
      ></button>
    </div>
  </div>
</div>

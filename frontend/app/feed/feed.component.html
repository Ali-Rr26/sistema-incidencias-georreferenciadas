<!-- Feed público estilo Instagram/Facebook -->
<header class="ig-header">
  <div class="ig-header-left">
    <span class="ig-logo">📍 Incidencias</span>
  </div>
  <div class="ig-header-right">
    <a href="#/login" class="ig-btn-login">Ingresar</a>
  </div>
</header>

<div class="ig-filters" id="feed-filters">
  <button class="ig-chip active" data-status="">Todos</button>
  <button class="ig-chip" data-status="pending">Pendientes</button>
  <button class="ig-chip" data-status="in_progress">En proceso</button>
  <button class="ig-chip" data-status="resolved">Resueltos</button>
</div>

<main class="ig-main">
  <!-- Loading skeleton -->
  <div id="feed-cargando" class="ig-skeleton-wrap">
    <div class="ig-skeleton-card">
      <div class="ig-skel-head">
        <div class="ig-skel-avatar"></div>
        <div class="ig-skel-line w-40"></div>
      </div>
      <div class="ig-skel-preview"></div>
      <div class="ig-skel-body">
        <div class="ig-skel-line w-60"></div>
        <div class="ig-skel-line w-30"></div>
      </div>
    </div>
    <div class="ig-skeleton-card">
      <div class="ig-skel-head">
        <div class="ig-skel-avatar"></div>
        <div class="ig-skel-line w-40"></div>
      </div>
      <div class="ig-skel-preview"></div>
      <div class="ig-skel-body">
        <div class="ig-skel-line w-60"></div>
        <div class="ig-skel-line w-30"></div>
      </div>
    </div>
    <div class="ig-skeleton-card">
      <div class="ig-skel-head">
        <div class="ig-skel-avatar"></div>
        <div class="ig-skel-line w-40"></div>
      </div>
      <div class="ig-skel-preview"></div>
      <div class="ig-skel-body">
        <div class="ig-skel-line w-60"></div>
        <div class="ig-skel-line w-30"></div>
      </div>
    </div>
  </div>

  <div id="feed-vacio" class="ig-empty d-none">
    <div class="ig-empty-icon">📭</div>
    <p>No hay incidencias publicadas.</p>
  </div>

  <div id="feed-list" class="ig-feed-list"></div>

  <!-- Infinite scroll sentinel -->
  <div id="feed-sentinel" class="ig-sentinel">
    <div class="ig-sentinel-spinner"><div class="ig-spinner"></div></div>
  </div>
</main>

<!-- Floating action button -->
<a href="#/login" class="ig-fab" id="fab-reportar" title="Reportar incidencia">
  <i class="fas fa-plus"></i>
</a>

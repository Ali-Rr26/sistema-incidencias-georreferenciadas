<!-- Feed público — sin shell autenticado -->
<header class="feed-header">
  <span class="feed-header-logo">📍 Incidencias</span>
  <a href="#/login" class="btn btn-sm btn-outline-secondary" style="font-size:.8rem;">Ingresar</a>
</header>

<div class="feed-filters" id="feed-filters">
  <button class="feed-filter-chip active" data-status="">Todos</button>
  <button class="feed-filter-chip" data-status="pending">Pendientes</button>
  <button class="feed-filter-chip" data-status="in_progress">En proceso</button>
  <button class="feed-filter-chip" data-status="resolved">Resueltos</button>
</div>

<main>
  <div id="feed-cargando" class="feed-grid">
    <!-- Skeleton cards -->
    <div class="feed-skeleton-card"><div class="skeleton-thumb"></div><div class="skeleton-line"></div><div class="skeleton-line short"></div></div>
    <div class="feed-skeleton-card"><div class="skeleton-thumb"></div><div class="skeleton-line"></div><div class="skeleton-line short"></div></div>
    <div class="feed-skeleton-card"><div class="skeleton-thumb"></div><div class="skeleton-line"></div><div class="skeleton-line short"></div></div>
    <div class="feed-skeleton-card"><div class="skeleton-thumb"></div><div class="skeleton-line"></div><div class="skeleton-line short"></div></div>
    <div class="feed-skeleton-card"><div class="skeleton-thumb"></div><div class="skeleton-line"></div><div class="skeleton-line short"></div></div>
    <div class="feed-skeleton-card"><div class="skeleton-thumb"></div><div class="skeleton-line"></div><div class="skeleton-line short"></div></div>
  </div>

  <div id="feed-vacio" class="feed-empty d-none">
    <div class="feed-empty-icon">📭</div>
    <p>No hay incidencias publicadas.</p>
  </div>

  <div id="feed-grid" class="feed-grid d-none"></div>

  <div class="feed-load-more" id="feed-paginacion" style="display:none!important;"></div>
  <div class="feed-load-more" id="feed-cargar-mas" style="display:none!important;">
    <button class="btn btn-outline-secondary btn-sm" id="btn-cargar-mas">Cargar más</button>
  </div>
</main>

<div class="gr-auth">
  <div class="gr-auth__card">
    <div class="gr-auth__header">
      <img src="/img/logo.svg" alt="Logo" class="gr-auth__logo" onerror="this.style.display='none'" />
      <h1 class="gr-auth__title">Recuperar contraseña</h1>
      <p class="gr-auth__subtitle">Ingresa tu correo electrónico y te enviaremos un enlace para restablecer tu contraseña.</p>
    </div>

    <form id="forgot-form" class="gr-auth__form" novalidate>
      <div id="estado-exito" class="alert alert-success d-none" role="alert">
        <i class="fa-solid fa-check-circle me-2"></i>
        <span id="exito-texto">Te hemos enviado un enlace de restablecimiento por correo electrónico.</span>
      </div>

      <div id="estado-error" class="alert alert-danger d-none" role="alert">
        <i class="fa-solid fa-triangle-exclamation me-2"></i>
        <span id="error-texto">No pudimos enviar el enlace. Verifica tu correo.</span>
      </div>

      <div class="gr-form-group">
        <label class="gr-form-label" for="email">Correo electrónico</label>
        <div class="gr-input-wrap">
          <i class="fa-solid fa-envelope gr-input-icon"></i>
          <input type="email" id="email" class="gr-input" placeholder="correo@ejemplo.com" required autocomplete="email" />
        </div>
        <div class="invalid-feedback">Ingrese un correo electrónico válido.</div>
      </div>

      <button type="submit" class="gr-btn-primary gr-btn-primary--full" id="btn-enviar">
        <span id="btn-texto">Enviar enlace</span>
        <span id="btn-loading" class="d-none">
          <span class="spinner-border spinner-border-sm me-1" role="status"></span>
          Enviando...
        </span>
      </button>

      <div class="gr-auth__footer">
        <a href="#/login" class="gr-link">
          <i class="fa-solid fa-arrow-left me-1"></i> Volver al inicio de sesión
        </a>
      </div>
    </form>
  </div>
</div>

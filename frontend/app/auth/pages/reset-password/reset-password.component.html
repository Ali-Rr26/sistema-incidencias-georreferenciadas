<div class="gr-auth">
  <div class="gr-auth__card">
    <div class="gr-auth__header">
      <img src="/img/logo.svg" alt="Logo" class="gr-auth__logo" onerror="this.style.display='none'" />
      <h1 class="gr-auth__title">Restablecer contraseña</h1>
      <p class="gr-auth__subtitle">Ingresa tu nueva contraseña.</p>
    </div>

    <form id="reset-form" class="gr-auth__form" novalidate>
      <div id="estado-exito" class="alert alert-success d-none" role="alert">
        <i class="fa-solid fa-check-circle me-2"></i>
        <span id="exito-texto">Tu contraseña ha sido restablecida exitosamente.</span>
      </div>

      <div id="estado-error" class="alert alert-danger d-none" role="alert">
        <i class="fa-solid fa-triangle-exclamation me-2"></i>
        <span id="error-texto">No se pudo restablecer la contraseña. El enlace puede haber expirado.</span>
      </div>

      <div class="gr-form-group">
        <label class="gr-form-label" for="password">Nueva contraseña</label>
        <div class="gr-input-wrap">
          <i class="fa-solid fa-lock gr-input-icon"></i>
          <input type="password" id="password" class="gr-input gr-input--pad-right" placeholder="Mínimo 6 caracteres" required minlength="6" autocomplete="new-password" />
          <button type="button" class="gr-input-eye" aria-label="Mostrar contraseña">
            <i class="fa-regular fa-eye"></i>
          </button>
        </div>
        <div class="invalid-feedback">La contraseña debe tener al menos 6 caracteres.</div>
      </div>

      <div class="gr-form-group">
        <label class="gr-form-label" for="password-confirm">Confirmar contraseña</label>
        <div class="gr-input-wrap">
          <i class="fa-solid fa-lock gr-input-icon"></i>
          <input type="password" id="password-confirm" class="gr-input gr-input--pad-right" placeholder="Repite la contraseña" required minlength="6" autocomplete="new-password" />
          <button type="button" class="gr-input-eye" aria-label="Mostrar contraseña">
            <i class="fa-regular fa-eye"></i>
          </button>
        </div>
        <div class="invalid-feedback">Las contraseñas deben coincidir.</div>
      </div>

      <button type="submit" class="gr-btn-primary gr-btn-primary--full" id="btn-restablecer">
        <span id="btn-texto">Restablecer contraseña</span>
        <span id="btn-loading" class="d-none">
          <span class="spinner-border spinner-border-sm me-1" role="status"></span>
          Restableciendo...
        </span>
      </button>

      <div class="gr-auth__footer">
        <a href="#/login" class="gr-link">
          <i class="fa-solid fa-arrow-left me-1"></i> Volver al inicio de sesión
        </a>
      </div>
    </form>
  </div>
</div>

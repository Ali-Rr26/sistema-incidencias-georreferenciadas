<!--
  appShell — unified responsive layout
  Single CSS-grid layout with role-aware chrome regions.
  - Sidebar visible on desktop (>=md), hidden on mobile
  - Bottom nav visible on mobile (<md), hidden on desktop
  - Role-based content via body[data-role="admin|citizen|guest"]
-->
<div class="app-shell">
  <header class="app-shell-header">
    <button
      type="button"
      class="app-shell-sidebar-toggle"
      id="app-shell-sidebar-toggle"
      aria-label="Alternar barra lateral"
      aria-controls="app-shell-sidebar"
      aria-expanded="true"
    >
      <i
        class="fa-solid fa-angles-left app-shell-sidebar-toggle__icon"
        aria-hidden="true"
      ></i>
    </button>

    <div class="app-shell-header__brand">
      <i class="fa-solid fa-location-dot"></i>
      <span class="app-shell-header__brand-name">GeoReporta</span>
    </div>

    <!-- Admin header: search + user menu dropdown -->
    <div class="app-shell-header__admin" data-show-on-role="admin">
      <div class="app-shell-header__search">
        <i class="fa-solid fa-magnifying-glass"></i>
        <input
          type="text"
          class="form-control app-shell-header__search-input"
          placeholder="Buscar incidencia..."
        />
      </div>
      <button
        class="app-shell-header__icon-btn"
        aria-label="Notificaciones"
        id="app-shell-bell-admin"
        data-nav-target="/notificaciones"
      >
        <i class="fa-regular fa-bell"></i>
        <span
          class="app-shell-header__notif-badge d-none"
          id="app-shell-bell-badge-admin"
          >0</span
        >
      </button>
      <button class="app-shell-header__icon-btn" aria-label="Configuración">
        <i class="fa-solid fa-gear"></i>
      </button>
      <div class="app-shell-user-menu">
        <button
          class="app-shell-user-menu__trigger"
          id="app-shell-user-menu-trigger"
          type="button"
          aria-haspopup="menu"
          aria-expanded="false"
        >
          <span class="app-shell-user-menu__avatar" id="app-shell-user-avatar"
            >U</span
          >
          <span class="app-shell-user-menu__name" id="app-shell-user-name"
            >Usuario</span
          >
          <i class="fa-solid fa-chevron-down app-shell-user-menu__arrow"></i>
        </button>
        <ul
          role="menu"
          id="app-shell-user-menu-panel"
          class="app-shell-user-menu__panel"
          hidden
        >
          <li
            role="menuitem"
            tabindex="-1"
            id="app-shell-user-menu-profile"
            class="app-shell-user-menu__item"
          >
            Mi perfil
          </li>
          <li
            role="menuitem"
            tabindex="-1"
            id="app-shell-user-menu-logout"
            class="app-shell-user-menu__item app-shell-user-menu__item--logout"
            aria-disabled="false"
          >
            Cerrar sesión
          </li>
        </ul>
      </div>
    </div>

    <!-- Citizen header: notification bell + user menu dropdown -->
    <div class="app-shell-header__citizen" data-show-on-role="citizen">
      <button
        class="app-shell-header__bell"
        id="app-shell-bell"
        type="button"
        aria-label="Notificaciones"
      >
        <i class="fa-regular fa-bell"></i>
      </button>
      <div class="app-shell-user-menu app-shell-user-menu--compact">
        <button
          class="app-shell-user-menu__trigger app-shell-user-menu__trigger--avatar"
          id="app-shell-citizen-menu-trigger"
          type="button"
          aria-haspopup="menu"
          aria-expanded="false"
          aria-label="Menú de usuario"
        >
          <span class="app-shell-avatar__letter" id="app-shell-avatar">?</span>
        </button>
        <ul
          role="menu"
          id="app-shell-citizen-menu-panel"
          class="app-shell-user-menu__panel"
          hidden
        >
          <li
            role="menuitem"
            tabindex="-1"
            id="app-shell-citizen-menu-profile"
            class="app-shell-user-menu__item"
          >
            Mi perfil
          </li>
          <li
            role="menuitem"
            tabindex="-1"
            id="app-shell-citizen-menu-logout"
            class="app-shell-user-menu__item app-shell-user-menu__item--logout"
            aria-disabled="false"
          >
            Cerrar sesión
          </li>
        </ul>
      </div>
    </div>

    <!-- Guest header: login button -->
    <a
      href="#/login"
      class="app-shell-login-btn"
      id="app-shell-login-btn"
      data-show-on-role="guest"
    >
      Ingresar
    </a>
  </header>

  <aside class="app-shell-sidebar" id="app-shell-sidebar">
    <!-- Admin sidebar: full nav with sections (PRINCIPAL / GESTIÓN / CONFIGURACIÓN) -->
    <nav
      class="app-shell-sidebar__nav"
      id="app-shell-admin-sidebar"
      data-show-on-role="admin"
    >
      <ul class="app-shell-sidebar__list" id="app-shell-admin-menu-list">
        <!-- Renderizado dinámico desde GET /api/menus/my (ver app-shell.component.js → renderAdminMenu) -->
      </ul>
    </nav>

    <!-- Citizen sidebar: flat list of 4 items -->
    <nav
      class="app-shell-sidebar__nav"
      id="app-shell-citizen-sidebar"
      data-show-on-role="citizen"
    >
      <ul class="app-shell-sidebar__list app-shell-sidebar__list--flat">
        <li>
          <a href="#/feed" class="app-shell-nav-item" data-route="/feed">
            <i class="fa-solid fa-house"></i>
            <span>Inicio</span>
          </a>
        </li>
        <li>
          <a href="#/mapa" class="app-shell-nav-item" data-route="/mapa">
            <i class="fa-solid fa-map-location-dot"></i>
            <span>Mapa</span>
          </a>
        </li>
        <li>
          <a href="#/alertas" class="app-shell-nav-item" data-route="/alertas">
            <i class="fa-solid fa-bell"></i>
            <span>Alertas</span>
          </a>
        </li>
        <li>
          <a
            href="#/configuracion/perfil"
            class="app-shell-nav-item"
            data-route="/configuracion/perfil"
          >
            <i class="fa-solid fa-user"></i>
            <span>Perfil</span>
          </a>
        </li>
      </ul>
    </nav>
  </aside>

  <main class="app-shell-main">
    <div id="page-outlet"></div>
  </main>

  <nav class="app-shell-bottom-nav" id="app-shell-bottom-nav">
    <!-- Admin bottom nav: 5 items, 3rd slot is "Crear incidencia" -->
    <a
      href="#/dashboard"
      class="app-shell-nav-item"
      data-route="/dashboard"
      data-show-on-role="admin"
    >
      <i class="fa-solid fa-gauge-high"></i>
      <span class="app-shell-bottom-nav__label">Dashboard</span>
    </a>
    <a
      href="#/incidencias"
      class="app-shell-nav-item"
      data-route="/incidencias"
      data-show-on-role="admin"
    >
      <i class="fa-solid fa-clipboard-list"></i>
      <span class="app-shell-bottom-nav__label">Incidencias</span>
    </a>
    <a
      href="#/incidencias/crear"
      class="app-shell-nav-item app-shell-bottom-nav__create"
      data-route="/incidencias/crear"
      data-show-on-role="admin"
    >
      <i class="fa-solid fa-circle-plus"></i>
      <span class="app-shell-bottom-nav__label">Crear</span>
    </a>
    <a
      href="#/alertas"
      class="app-shell-nav-item"
      data-route="/alertas"
      data-show-on-role="admin"
    >
      <i class="fa-solid fa-bell"></i>
      <span class="app-shell-bottom-nav__label">Alertas</span>
    </a>
    <a
      href="#/configuracion/perfil"
      class="app-shell-nav-item"
      data-route="/configuracion/perfil"
      data-show-on-role="admin"
    >
      <i class="fa-solid fa-user"></i>
      <span class="app-shell-bottom-nav__label">Perfil</span>
    </a>

    <!-- Citizen bottom nav: 5 items, 3rd slot is "+" plus button -->
    <a
      href="#/feed"
      class="app-shell-nav-item"
      data-route="/feed"
      data-show-on-role="citizen guest"
    >
      <i class="fa-solid fa-house"></i>
      <span class="app-shell-bottom-nav__label">Feed</span>
    </a>
    <a
      href="#/mapa"
      class="app-shell-nav-item"
      data-route="/mapa"
      data-show-on-role="citizen guest"
    >
      <i class="fa-solid fa-map-location-dot"></i>
      <span class="app-shell-bottom-nav__label">Mapa</span>
    </a>
    <a
      href="javascript:void(0)"
      class="app-shell-nav-item app-shell-bottom-nav__plus"
      id="app-shell-bottom-plus"
      data-show-on-role="citizen guest"
      aria-label="Reportar incidencia"
    >
      <i class="fa-solid fa-circle-plus"></i>
    </a>
    <a
      href="#/alertas"
      class="app-shell-nav-item"
      data-route="/alertas"
      data-show-on-role="citizen guest"
    >
      <i class="fa-solid fa-bell"></i>
      <span class="app-shell-bottom-nav__label">Alertas</span>
    </a>
    <a
      href="#/configuracion/perfil"
      class="app-shell-nav-item"
      data-route="/configuracion/perfil"
      data-show-on-role="citizen guest"
    >
      <i class="fa-solid fa-user"></i>
      <span class="app-shell-bottom-nav__label">Perfil</span>
    </a>
  </nav>
</div>

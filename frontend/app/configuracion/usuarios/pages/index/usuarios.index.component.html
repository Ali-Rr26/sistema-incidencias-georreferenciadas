<div class="page-breadcrumb">
  <div class="row align-items-center">
    <div class="col-7 align-self-center">
      <h4 class="page-title text-truncate text-dark font-weight-medium mb-1">Usuarios</h4>
      <nav aria-label="breadcrumb">
        <ol class="breadcrumb m-0 p-0">
          <li class="breadcrumb-item"><a href="#/dashboard" class="text-muted">Dashboard</a></li>
          <li class="breadcrumb-item text-muted active">Usuarios</li>
        </ol>
      </nav>
    </div>
    <div class="col-5 text-end">
      <a href="#/usuarios/crear" class="btn btn-primary btn-sm">
        <i class="fas fa-plus me-1"></i>Nuevo
      </a>
    </div>
  </div>
</div>

<div class="container-fluid">
  <div class="card mb-3">
    <div class="card-body py-3">
      <div class="row g-2 align-items-end">
        <div class="col-md-6">
          <input type="text" class="form-control form-control-sm" id="filtro-buscar" placeholder="Buscar por nombre o email...">
        </div>
        <div class="col-md-3">
          <select class="form-select form-select-sm" id="filtro-rol">
            <option value="">Todos los roles</option>
          </select>
        </div>
        <div class="col-md-3 d-flex gap-2">
          <button type="button" class="btn btn-primary btn-sm w-100" id="btn-filtrar">
            <i class="fas fa-search me-1"></i>Buscar
          </button>
          <button type="button" class="btn btn-outline-secondary btn-sm" id="btn-limpiar">
            <i class="fas fa-times"></i>
          </button>
        </div>
      </div>
    </div>
  </div>

  <div class="card">
    <div class="card-body">
      <div id="estado-cargando" class="text-center py-5">
        <div class="spinner-border text-primary" role="status"></div>
        <p class="text-muted mt-2 mb-0">Cargando usuarios...</p>
      </div>
      <div id="estado-vacio" class="text-center py-5 d-none">
        <i class="fas fa-users text-muted" style="font-size:2.5rem;"></i>
        <p class="text-muted mt-3 mb-0">No se encontraron usuarios.</p>
      </div>
      <div id="estado-error" class="text-center py-5 d-none">
        <i class="fas fa-exclamation-circle text-danger" style="font-size:2.5rem;"></i>
        <p class="text-muted mt-3 mb-1">Error al cargar los datos.</p>
        <button class="btn btn-sm btn-outline-primary" id="btn-reintentar">Reintentar</button>
      </div>
      <div id="contenedor-tabla" class="d-none">
        <div class="table-responsive d-none d-md-block">
          <table class="table border table-striped table-bordered text-nowrap mb-0">
            <thead>
              <tr>
                <th>#</th>
                <th>Nombre</th>
                <th>Email</th>
                <th>Rol</th>
                <th>Teléfono</th>
                <th class="text-center">Acciones</th>
              </tr>
            </thead>
            <tbody id="tabla-body"></tbody>
          </table>
        </div>
        <div id="contenedor-cards" class="d-md-none p-3"></div>
        <div class="d-flex justify-content-between align-items-center px-3 py-2 border-top">
          <small class="text-muted" id="info-resultados"></small>
          <nav><ul class="pagination pagination-sm mb-0" id="paginacion"></ul></nav>
        </div>
      </div>
    </div>
  </div>
</div>


<!-- Modal Eliminar -->
<div class="modal fade" id="modal-eliminar" tabindex="-1">
  <div class="modal-dialog modal-sm">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Confirmar eliminación</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body"><p class="mb-0">¿Eliminar a "<strong id="modal-eliminar-nombre"></strong>"?</p></div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary btn-sm" data-bs-dismiss="modal">Cancelar</button>
        <button type="button" class="btn btn-danger btn-sm" id="btn-confirmar-eliminar">
          <span id="eliminar-texto">Eliminar</span>
          <span id="eliminar-loading" class="d-none"><span class="spinner-border spinner-border-sm"></span></span>
        </button>
      </div>
    </div>
  </div>
</div>

<div class="position-fixed bottom-0 end-0 p-3" style="z-index:1100">
  <div id="toast-msg" class="toast align-items-center text-white border-0" role="alert">
    <div class="d-flex">
      <div class="toast-body" id="toast-msg-texto"></div>
      <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
    </div>
  </div>
</div>

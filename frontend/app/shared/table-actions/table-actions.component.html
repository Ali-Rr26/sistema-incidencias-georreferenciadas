<div class="d-flex justify-content-center gap-1">
  <!-- Ver button — always rendered if the page guard authorized the listing -->
  <a
    class="btn btn-sm btn-outline-primary btn-ver"
    href="#"
    data-action="view"
    aria-label="Ver detalle"
    title="Ver detalle"
  >
    <i class="fa-solid fa-eye" aria-hidden="true"></i>
  </a>

  <!-- Kebab dropdown -->
  <div class="dropdown">
    <button
      class="btn btn-sm btn-outline-secondary dropdown-toggle"
      type="button"
      data-bs-toggle="dropdown"
      aria-expanded="false"
      aria-label="Acciones"
    >
      <i class="fa-solid fa-ellipsis-v" aria-hidden="true"></i>
    </button>
    <ul class="dropdown-menu dropdown-menu-end">
      <!-- Editar item: rendered by JS based on permission slugs -->
      <li
        class="table-actions-edit-item"
        data-action="edit"
        style="display: none"
      >
        <a
          class="dropdown-item table-actions-edit"
          href="#"
          data-action="edit"
          aria-label="Editar"
        >
          <i class="fa-solid fa-edit" aria-hidden="true"></i> Editar
        </a>
      </li>
      <!-- Eliminar item: rendered by JS based on permission slugs -->
      <li
        class="table-actions-delete-item"
        data-action="delete"
        style="display: none"
      >
        <a
          class="dropdown-item table-actions-delete text-danger"
          href="#"
          data-action="delete"
          aria-label="Eliminar"
        >
          <i class="fa-solid fa-trash-alt" aria-hidden="true"></i> Eliminar
        </a>
      </li>
    </ul>
  </div>
</div>

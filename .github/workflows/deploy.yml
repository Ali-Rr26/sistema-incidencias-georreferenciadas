# ============================================
# Deploy - Sistema de Incidencias Georreferenciadas
# ============================================
# Runs on the self-hosted runner of the server, which is also the single
# Docker Swarm node. Builds images locally, then deploys deploy.yml as-is
# with `docker stack deploy`.
#
# Requirements:
#   - Configured self-hosted runner
#   - Docker Engine with Swarm mode active (`docker swarm init`, one-time
#     manual bootstrap — see docs/docker-swarm-guide.md)
#   - .env files placed in the runner workspace:
#     - Root .env (for deploy.yml variables)
#     - backend/.env (for Laravel/Swoole application secrets)
#     (clean: false preserves these between runs)
#
# NOTE: `docker stack deploy` does NOT read .env files the way
# `docker compose up` does (Compose feature only, not supported by Swarm)
# — it DOES interpolate ${VAR} from the process environment, so we export
# .env into the shell first. We deliberately do NOT pre-render the file
# with `docker compose config`: that round-trip rewrites `cpus: "0.5"` and
# short-form `ports:` into typed long-form YAML (float / string) that
# `docker stack deploy`'s stricter parser then rejects
# ("must be a string" / "must be a integer").
# ============================================

name: Deploy App

on:
  push:
    branches: [develop]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
          clean: false

      - name: Ensure environment files exist
        run: |
          if [ ! -f .env ]; then
            echo "❌ Root .env not found!"
            echo "Create it manually in the runner workspace root first."
            exit 1
          fi
          if [ ! -f backend/.env ]; then
            echo "❌ backend/.env not found!"
            echo "Create it manually in the runner workspace/backend/ first."
            exit 1
          fi

      - name: Ensure Swarm mode is active
        run: |
          if [ "$(docker info --format '{{.Swarm.LocalNodeState}}')" != "active" ]; then
            echo "❌ Docker Swarm is not active on this host."
            echo "Run 'docker swarm init' manually once (see docs/docker-swarm-guide.md), then re-run this workflow."
            exit 1
          fi

      # Images are tagged with the commit SHA so every deploy changes the
      # service spec — Swarm skips updates when the image reference is
      # unchanged (a plain :latest tag makes deploys silent no-ops on a
      # single-node stack without a registry).
      - name: Build images
        env:
          DOCKER_BUILDKIT: 1
          COMPOSE_DOCKER_CLI_BUILD: 1
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker compose -f deploy.yml build

      # Independent overlay network. `deploy.yml` declares it as
      # `external: true`, so the stack will NOT create it and would fail
      # to deploy if it doesn't exist on the Swarm host. We create it
      # here, idempotently, after images are built and before
      # `docker stack deploy`. `--attachable` lets standalone containers
      # (debug, one-off tooling) join the network without needing to
      # become Swarm services.
      #
      # On the existing-network path we re-validate driver/scope: a same-
      # named `bridge` or other non-overlay network would be silently
      # accepted here, and `docker stack deploy` would then fail with a
      # less actionable "is not in the right scope" message. Failing here
      # with the exact mismatch keeps the operator on the right path
      # (recreate the network rather than debugging stack errors).
      - name: Ensure overlay network exists
        run: |
          if ! docker network inspect incidencias-network >/dev/null 2>&1; then
            echo "Creating overlay network 'incidencias-network'..."
            docker network create --driver overlay --attachable incidencias-network
          else
            EXISTING_DRIVER=$(docker network inspect --format '{{.Driver}}' incidencias-network)
            EXISTING_SCOPE=$(docker network inspect --format '{{.Scope}}' incidencias-network)
            if [ "$EXISTING_DRIVER" != "overlay" ] || [ "$EXISTING_SCOPE" != "swarm" ]; then
              echo "::error::Network 'incidencias-network' exists but is incompatible with Swarm (driver=$EXISTING_DRIVER, scope=$EXISTING_SCOPE). Swarm stacks require driver=overlay and scope=swarm."
              echo "::error::Recreate it with: docker network rm incidencias-network && docker network create --driver overlay --attachable incidencias-network"
              exit 1
            fi
            EXISTING_ATTACH=$(docker network inspect --format '{{.Attachable}}' incidencias-network)
            if [ "$EXISTING_ATTACH" != "true" ]; then
              echo "::warning::Network 'incidencias-network' is not attachable; standalone containers (debug) cannot join it. Services are unaffected."
            else
              echo "Network 'incidencias-network' already exists with expected config."
            fi
          fi
          docker network inspect --format '{{.Name}} ({{.Driver}}, scope={{.Scope}}, attachable={{.Attachable}})' incidencias-network

      - name: Deploy stack
        run: |
          set -a
          source .env
          set +a
          export IMAGE_TAG=${{ github.sha }}
          docker stack deploy -c deploy.yml incidencias-stack

      - name: Health check
        run: |
          echo "Waiting for services to stabilize..."
          sleep 15
          docker stack services incidencias-stack

      - name: Clean up
        run: docker image prune -f

name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:

jobs:
  frontend-quality:
    name: Frontend quality checks
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Run frontend lint
        run: npm run lint

      - name: Run frontend format check
        run: npm run format

  frontend-tests:
    name: Frontend tests (${{ matrix.suite }})
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    strategy:
      fail-fast: false
      matrix:
        suite: [unit, integration, snapshot]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Run frontend suite
        run: npm run test:${{ matrix.suite }}

  frontend-e2e:
    name: Frontend test (E2E)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    services:
      postgres:
        image: postgis/postgis:17-3.5-alpine
        env:
          POSTGRES_DB: incidencias_db
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:8-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_pgsql, pgsql, pdo_sqlite, sqlite3, intl, bcmath, curl, swoole
          tools: composer
          coverage: none
          cache: composer

      - name: Install frontend dependencies
        run: npm ci

      - name: Install backend dependencies
        working-directory: backend
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Setup backend env
        working-directory: backend
        run: cp ../.env.example .env && php artisan key:generate

      - name: Run database migrations
        working-directory: backend
        env:
          DB_CONNECTION: pgsql
          DB_HOST: localhost
          DB_PORT: 5432
          DB_DATABASE: incidencias_db
          DB_USERNAME: user
          DB_PASSWORD: password
        run: php artisan migrate --force

      - name: Seed database
        working-directory: backend
        env:
          DB_CONNECTION: pgsql
          DB_HOST: localhost
          DB_PORT: 5432
          DB_DATABASE: incidencias_db
          DB_USERNAME: user
          DB_PASSWORD: password
        run: php artisan db:seed --force

      - name: Start backend (background)
        working-directory: backend
        env:
          DB_CONNECTION: pgsql
          DB_HOST: localhost
          DB_PORT: 5432
          DB_DATABASE: incidencias_db
          DB_USERNAME: user
          DB_PASSWORD: password
          APP_URL: http://localhost:8000
        run: |
          php artisan serve --port=8000 &
          sleep 3
          curl -f http://localhost:8000/api/health || echo "Backend not ready yet"

      - name: Start frontend (background)
        run: |
          npm run dev &
          sleep 5
          curl -f http://localhost:3000 || echo "Frontend not ready yet"

      - name: Run Cypress E2E tests
        run: npm run test:e2e

  backend:
    name: Backend checks
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    # Plaintext, non-secret test-only credentials — GitHub Actions does not
    # expose repository secrets to fork PRs' job-level `services`/`env`
    # blocks (same constraint already documented below for SONAR_TOKEN), so
    # a real secret here would break CI for fork contributors. The DB is
    # ephemeral, network-isolated to the runner, and holds no real data.
    # `CREATE EXTENSION postgis` / `CREATE DATABASE` (per-worker parallel
    # test DBs) both require a superuser/CREATEDB role, which is exactly
    # what this image's default role has. Do NOT reuse prod DB_* secrets.
    env:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: incidencias_test

    services:
      postgres:
        image: postgis/postgis:17-3.5-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: incidencias_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d incidencias_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_pgsql, pgsql, intl, bcmath, curl, swoole
          tools: composer
          coverage: none
          cache: composer

      - name: Install backend dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Run backend lint
        run: composer run lint

      - name: Run backend format check
        run: composer run format:check

      - name: Run backend tests
        run: composer run test

      - name: Check frontend constants are up-to-date
        run: php artisan incidents:generate-frontend-constants --check

  sonar-scan:
    name: SonarQube scan
    runs-on: ubuntu-latest
    needs: [frontend-quality, frontend-tests, frontend-e2e, backend]
    # Skipped until the SONAR_TOKEN secret is configured — self-hosted SonarQube
    # has no public instance for this repo to scan against by default. We can't
    # gate on `secrets.SONAR_TOKEN` in this `if:` because GitHub Actions does
    # not expose secrets in job-level `if:` for PRs from forks; the check is
    # performed inside the steps instead.

    # Same plaintext-non-secret rationale as the `backend` job above — this
    # job also runs `composer run test:coverage`, which needs the same
    # Postgres+PostGIS service.
    env:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: incidencias_test

    services:
      postgres:
        image: postgis/postgis:17-3.5-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: incidencias_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d incidencias_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run frontend coverage
        working-directory: frontend
        run: npm run test:coverage

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_pgsql, pgsql, intl, bcmath, curl, swoole
          tools: composer
          coverage: pcov
          cache: composer

      - name: Install backend dependencies
        working-directory: backend
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Run backend coverage
        working-directory: backend
        run: composer run test:coverage

      - name: Check SonarQube secrets
        id: sonar-secrets
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [ -n "$SONAR_TOKEN" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::SONAR_TOKEN not configured — skipping SonarQube scan"
          fi

      - name: SonarQube scan
        if: steps.sonar-secrets.outputs.configured == 'true'
        uses: sonarsource/sonarqube-scan-action@v4
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  frontend-quality:
    name: Frontend quality checks
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Run frontend lint
        run: npm run lint

      - name: Run frontend format check
        run: npm run format

  frontend-tests:
    name: Frontend tests (${{ matrix.suite }})
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    strategy:
      fail-fast: false
      matrix:
        suite: [unit, integration, snapshot]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Run frontend suite
        run: npm run test:${{ matrix.suite }}

  backend:
    name: Backend checks
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_sqlite, sqlite3, intl, bcmath, curl
          tools: composer
          coverage: none
          cache: composer

      - name: Install backend dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Run backend lint
        run: composer run lint

      - name: Run backend format check
        run: composer run format:check

      - name: Run backend tests
        run: composer run test

      - name: Check frontend constants are up-to-date
        run: php artisan incidents:generate-frontend-constants --check

services:
  # ==========================================
  # FRONTEND (Static Nginx Server)
  # ==========================================
  frontend:
    image: ${NGINX_IMAGE:-nginx:alpine}
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
    networks:
      - dev-network

  # ==========================================
  # BACKEND
  # ==========================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - ./backend/.env
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    environment:
      - DB_CONNECTION=${DB_CONNECTION:-pgsql}
      - DB_HOST=db
      - DB_PORT=5432
      - DB_DATABASE=${DB_DATABASE:-incidencias_db}
      - DB_USERNAME=${DB_USERNAME:-user}
      - DB_PASSWORD=${DB_PASSWORD:-password}
      - REDIS_HOST=redis
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - dev-network

  # ==========================================
  # DATABASE
  # ==========================================
  db:
    image: ${POSTGIS_IMAGE:-postgis/postgis:17-3.5-alpine}
    environment:
      POSTGRES_DB: ${DB_DATABASE:-incidencias_db}
      POSTGRES_USER: ${DB_USERNAME:-user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-password}
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-user} -d ${DB_DATABASE:-incidencias_db}"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - dev-network

  # ==========================================
  # CACHE & QUEUE
  # ==========================================
  redis:
    image: ${REDIS_IMAGE:-redis:8-alpine}
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - dev-network

volumes:
  db_data:
  redis_data:

networks:
  dev-network:
    driver: bridge

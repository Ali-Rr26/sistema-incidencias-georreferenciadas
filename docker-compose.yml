services:
  # ==========================================
  # FRONTEND (Static Nginx Server)
  # ==========================================
  frontend:
    image: nginx:alpine
    ports:
      - "3000:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
    networks:
      - dev-network

  # ==========================================
  # BACKEND (Laravel Octane + RoadRunner)
  # ==========================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - ./backend/.env
    ports:
      - "8000:8000"
    environment:
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=incidencias_db
      - DB_USERNAME=user
      - DB_PASSWORD=password
    depends_on:
      db:
        condition: service_healthy
    networks:
      - dev-network

  # ==========================================
  # DATABASE (MySQL 8.0)
  # ==========================================
  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: incidencias_db
      MYSQL_USER: user
      MYSQL_PASSWORD: password
    volumes:
      - db_data:/var/lib/mysql
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - dev-network

volumes:
  db_data:

networks:
  dev-network:
    driver: bridge

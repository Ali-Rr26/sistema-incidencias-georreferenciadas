services:
  # Backend: PHP-FPM
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: app-backend
    volumes:
      - ./backend:/var/www
    networks:
      - app-network

  # Servidor Web (Nginx) para servir el Frontend y pasar pedidos al Backend
  webserver:
    image: nginx:alpine
    container_name: app-webserver
    ports:
      - "8080:80"
    volumes:
      - ./frontend:/usr/share/nginx/html
      - ./backend:/var/www
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    networks:
      - app-network
    depends_on:
      - backend

  # Base de Datos (MySQL)
  db:
    image: mysql:8.0
    container_name: app-db
    environment:
      MYSQL_DATABASE: incidencias_db
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

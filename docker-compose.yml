services:
  # ==========================================
  # FRONTEND (Static Nginx Server)
  # ==========================================
  frontend:
    image: nginx:alpine
    ports:
      - "3000:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
    networks:
      - dev-network

  # ==========================================
  # BACKEND (Laravel Octane + RoadRunner)
  # ==========================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - ./backend/.env
    ports:
      - "8000:8000"
    environment:
      - DB_CONNECTION=pgsql
      - DB_HOST=db
      - DB_PORT=5432
      - DB_DATABASE=incidencias_db
      - DB_USERNAME=user
      - DB_PASSWORD=password
      - REDIS_HOST=redis
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - dev-network

  # ==========================================
  # DATABASE (PostgreSQL 15 + PostGIS 3.3)
  # ==========================================
  db:
    image: postgis/postgis:15-3.3
    environment:
      POSTGRES_DB: incidencias_db
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d incidencias_db"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - dev-network

  # ==========================================
  # CACHE & QUEUE (Redis)
  # ==========================================
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - dev-network

volumes:
  db_data:
  redis_data:

networks:
  dev-network:
    driver: bridge

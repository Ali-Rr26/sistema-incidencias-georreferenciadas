services:
  # ==========================================
  # FRONTEND (Static Nginx Server)
  # ==========================================
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      backend:
        condition: service_started
    networks:
      - dev-network
    develop:
      watch:
        - action: sync
          path: ./frontend
          target: /usr/share/nginx/html

  # ==========================================
  # BACKEND
  # ==========================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file: .env
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
    volumes:
      - ./backend/app:/var/www/backend/app
      - ./backend/routes:/var/www/backend/routes
      - ./backend/config:/var/www/backend/config
      - ./backend/resources:/var/www/backend/resources
      - ./backend/database:/var/www/backend/database
      - ./backend/tests:/var/www/backend/tests
    develop:
      watch:
        - action: rebuild
          path: ./backend
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      rustfs:
        condition: service_healthy
    networks:
      - dev-network

  # ==========================================
  # DATABASE
  # ==========================================
  db:
    image: ${POSTGIS_IMAGE:-postgis/postgis:17-3.5-alpine}
    environment:
      POSTGRES_DB: ${DB_DATABASE:-incidencias_db}
      POSTGRES_USER: ${DB_USERNAME:-user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-password}
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-user} -d ${DB_DATABASE:-incidencias_db}"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - dev-network

  # ==========================================
  # CACHE & QUEUE
  # ==========================================
  redis:
    image: ${REDIS_IMAGE:-redis:8-alpine}
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - dev-network

  # ==========================================
  # RUSTFS S3-COMPATIBLE STORAGE
  # ==========================================
  # ─── RustFS Storage (S3-compatible, Apache 2.0) ──────────────────
  rustfs:
    image: ${RUSTFS_IMAGE:-rustfs/rustfs:latest}
    container_name: sistema-s3-incidencias
    restart: unless-stopped
    user: root
    entrypoint: >
      /bin/sh -c "chown -R 10001:10001 /data && exec /entrypoint.sh rustfs"
    environment:
      RUSTFS_ACCESS_KEY: ${STORAGE_ACCESS_KEY:-rustfsadmin}
      RUSTFS_SECRET_KEY: ${STORAGE_SECRET_KEY:-rustfsadmin}
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ENABLE: "true"
    volumes:
      - rustfs_data:/data
    ports:
      - "${RUSTFS_API_PORT:-9000}:9000"
      - "${RUSTFS_CONSOLE_PORT:-9001}:9001"
    healthcheck:
      test: ["CMD-SHELL", "curl -s -o /dev/null -w \"%{http_code}\" http://localhost:9000/ | grep -qE '200|403'"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - dev-network
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M

  # ==========================================
  # CLOUDFLARE TUNNEL
  # ==========================================
  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    restart: unless-stopped
    depends_on:
      - frontend
      - backend
    networks:
      - dev-network

volumes:
  db_data:
  redis_data:
  rustfs_data:

networks:
  dev-network:
    driver: bridge
